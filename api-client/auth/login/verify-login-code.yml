info:
  name: verify-login-code
  type: http
  seq: 2

http:
  method: POST
  url: "{{authUrl}}/verify-login-code"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "email": "{{email}}",
        "code": "{{verificationCode}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |
        if (res.status === 200) {
          bru.setEnvVar("accessToken", res.body.access_token);
          bru.setEnvVar("refreshToken", res.body.refresh_token);
        }
    - type: tests
      code: |
        test("status is 200", function() {
          expect(res.status).to.equal(200);
        });
        test("tokens present", function() {
          expect(res.body.access_token).to.be.a("string");
          expect(res.body.refresh_token).to.be.a("string");
        });
        test("token type is bearer", function() {
          expect(res.body.token_type).to.equal("bearer");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
