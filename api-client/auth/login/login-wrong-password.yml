info:
  name: Login - Wrong Password (negative)
  type: http
  seq: 3

http:
  method: POST
  url: "{{authUrl}}/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "email": "{{email}}",
        "password": ""
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 401", function() {
          expect(res.status).to.equal(401);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
