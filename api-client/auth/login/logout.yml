info:
  name: logout
  type: http
  seq: 5

http:
  method: POST
  url: "{{authUrl}}/logout"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "refresh_token": "{{refreshToken}}"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 204) {
          bru.setEnvVar("accessToken", "");
          bru.setEnvVar("refreshToken", "");
        }
    - type: tests
      code: |-
        test("status is 204", function() {
          expect(res.status).to.equal(204);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
