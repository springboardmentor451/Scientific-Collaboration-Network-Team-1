info:
  name: refresh
  type: http
  seq: 4

http:
  method: POST
  url: "{{authUrl}}/refresh"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "refresh_token": "{{refreshToken}}" 
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setEnvVar("accessToken", res.body.access_token);
        }
    - type: tests
      code: |-
        test("status is 200", function() {
          expect(res.status).to.equal(200);
        });
        test("new access_token returned", function() {
          expect(res.body.access_token).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
