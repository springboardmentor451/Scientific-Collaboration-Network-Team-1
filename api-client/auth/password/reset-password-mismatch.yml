info:
  name: reset-password-mismatch
  type: http
  seq: 3

http:
  method: POST
  url: "{{authUrl}}/reset-password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "email": "{{email}}",
        "code": "{{verificationCode}}",
        "new_password": "NewSecure99",
        "confirm_password": "Different99"
      }

runtime:
  scripts:
    - type: tests
      code: |
        test("status is 422", function() {
          expect(res.status).to.equal(422);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
