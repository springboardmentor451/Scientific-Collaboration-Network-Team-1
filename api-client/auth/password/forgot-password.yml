info:
  name: forgot-password
  type: http
  seq: 2

http:
  method: POST
  url: "{{authUrl}}/forgot-password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "email": "{{email}}"
      }

runtime:
  scripts:
    - type: tests
      code: |
        test("status is 200", function() {
          expect(res.status).to.equal(200);
        });
        test("vague security message", function() {
          expect(res.body.message).to.include("code has been sent");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
