info:
  name: reset-password
  type: http
  seq: 2

http:
  method: POST
  url: "{{authUrl}}/reset-password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "email": "{{email}}",
        "code": "{{verificationCode}}",
        "new_password": "123456789q",
        "confirm_password": "123456789q"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function() {
          expect(res.status).to.equal(200);
        });
        test("password updated", function() {
          expect(res.body.message).to.include("updated");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
