info:
  name: register
  type: http
  seq: 1

http:
  method: POST
  url: "{{authUrl}}/register"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "email": "{{email}}",
        "password": "{{password}}",
        "requested_role": "researcher"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 201", function() {
          expect(res.status).to.equal(201);
        });
        test("message returned", function() {
          expect(res.body.message).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
