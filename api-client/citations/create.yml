info:
  name: create
  type: http
  seq: 1

http:
  method: POST
  url: "{{citationUrl}}/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "citing_publication_id": {{publicationId}},
        "cited_publication_ids": [1, 2]
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: after-response
      code: |
        if (res.status === 201 && res.body.length > 0) {
          bru.setEnvVar("citationId", res.body[0].citation_id);
        }
    - type: tests
      code: |
        test("status is 201", function() {
          expect(res.status).to.equal(201);
        });
        test("returns array", function() {
          expect(res.body).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
