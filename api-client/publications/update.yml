info:
  name: update
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{publicationUrl}}/{{publicationId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "doi": "{{doi}}",
        "title": null,
        "publication_type": null,
        "status": null,
        "researcher_ids": null,
        "external_authors": null,
        "abstract": null,
        "publication_date": null,
        "conference_id": null
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  variables:
    - name: doi
      value: ""
      description: ""
  scripts:
    - type: tests
      code: |
        test("status is 200", function() {
          expect(res.status).to.equal(200);
        });
        test("doi updated", function() {
          expect(res.body.doi).to.equal(bru.getVar("doi"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
