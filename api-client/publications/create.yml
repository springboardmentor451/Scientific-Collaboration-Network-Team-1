info:
  name: create
  type: http
  seq: 1

http:
  method: POST
  url: "{{publicationUrl}}/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "title": "",
        "abstract": null,
        "publication_type": "",
        "status": "",
        "doi": null,
        "conference_id": null,
        "publication_date": null,
        // list of ids
        "researcher_ids": [],
        // list of names
        "external_authors": [],
        "is_open_access": true
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: after-response
      code: |
        if (res.status === 201) {
          bru.setEnvVar("publicationId", res.body.publication_id);
        }
    - type: tests
      code: |
        test("status is 201", function() {
          expect(res.status).to.equal(201);
        });
        test("publicationId saved", function() {
          expect(res.body.publication_id).to.be.a("number");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
