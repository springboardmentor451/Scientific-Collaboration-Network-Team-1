info:
  name: get-by-id
  type: http
  seq: 4

http:
  method: GET
  url: "{{publicationUrl}}/{{publicationId}}"
  headers: []
  body:
    type: none
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |
        test("status is 200", function() {
          expect(res.status).to.equal(200);
        });
        test("matches publicationId", function() {
          expect(res.body.publication_id).to.equal(parseInt(bru.getVar("publicationId")));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
