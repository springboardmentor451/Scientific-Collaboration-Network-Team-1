info:
  name: Publications Report JSON
  type: http
  seq: 2

http:
  method: POST
  url: "{{reportUrl}}/publications/json"

auth:
  mode: bearer
  bearer:
    token: "{{access_token}}"

headers:
  - name: Content-Type
    value: application/json

body:
  type: json
  json: |
    {
      "status": null,
      "researcher_id": null,
      "from_date": null,
      "to_date": null
    }

runtime:
  scripts:
    - type: tests
      code: |
        test("status is 200", function() {
          expect(res.status).to.equal(200);
        });
        test("content type is json", function() {
          expect(res.headers["content-type"]).to.include("application/json");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
