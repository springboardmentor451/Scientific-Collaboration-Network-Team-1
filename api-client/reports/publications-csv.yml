info:
  name: publications-csv
  type: http
  seq: 1

http:
  method: POST
  url: "{{reportUrl}}/publications/csv"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "status": "",
        "researcher_id": "",
        "from_date": "",
        "to_date": ""
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |
        test("status is 200", function() {
          expect(res.status).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
