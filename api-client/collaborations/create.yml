info:
  name: create
  type: http
  seq: 1

http:
  method: POST
  url: "{{collaborationUrl}}/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "researcher_ids": [{{researcherId}}, 2],
        "collaboration_type": "co_authorship"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: after-response
      code: |
        if (res.status === 201) {
          bru.setEnvVar("collaborationId", res.body.collaboration_id);
        }
    - type: tests
      code: |
        test("status is 201", function() {
          expect(res.status).to.equal(201);
        });
        test("count starts at 1", function() {
          expect(res.body.collaboration_count).to.equal(1);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
