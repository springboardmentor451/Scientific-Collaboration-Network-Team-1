info:
  name: reject
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{userUrl}}/{{userId}}/reject"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |
        test("status is 200", function() {
          expect(res.status).to.equal(200);
        });
        test("status is rejected", function() {
          expect(res.body.status).to.equal("rejected");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
