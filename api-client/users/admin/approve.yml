info:
  name: approve
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{userUrl}}/{{userId}}/approve"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |
        test("status is 200", function() {
          expect(res.status).to.equal(200);
        });
        test("status is active", function() {
          expect(res.body.status).to.equal("active");
        });
        test("role assigned", function() {
          expect(res.body.role).to.not.be.null;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
