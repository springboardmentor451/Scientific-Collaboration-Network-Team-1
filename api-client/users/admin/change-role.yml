info:
  name: change-role
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{userUrl}}/{{userId}}/role"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "role": "researcher"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
