info:
  name: reject-role-change
  type: http
  seq: 11

http:
  method: PATCH
  url: "{{baseUrl}}/api/users/{{userId}}/reject-role-change"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |
        test("status is 200", function() {
          expect(res.status).to.equal(200);
        });
        test("requested_role cleared, role unchanged", function() {
          expect(res.body.requested_role).to.be.null;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
