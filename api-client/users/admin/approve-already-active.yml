info:
  name: approve-already-active
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/api/users/{{userId}}/approve"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |
        test("status is 409", function() {
          expect(res.status).to.equal(409);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
