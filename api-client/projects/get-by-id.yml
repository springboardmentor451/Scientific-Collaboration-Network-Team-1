info:
  name: get-by-id
  type: http
  seq: 4

http:
  method: GET
  url: "{{projectUrl}}/{{projectId}}"
  headers: []
  body:
    type: none
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |
        test("status is 200", function() {
          expect(res.status).to.equal(200);
        });
        test("matches projectId", function() {
          expect(res.body.project_id).to.equal(parseInt(bru.getVar("projectId")));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
