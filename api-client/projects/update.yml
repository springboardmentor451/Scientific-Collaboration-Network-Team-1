info:
  name: update
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{projectUrl}}/{{projectId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "status": "{{projectStatus}}",
        "name": null,
        "description": null,
        "start_date": null,
        "end_date": null,
        "researcher_ids": null
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  variables:
    - name: projectStatus
      value: ""
      description: ""
  scripts:
    - type: tests
      code: |
        test("status is 200", function() {
          expect(res.status).to.equal(200);
        });
        test("status updated", function() {
          expect(res.body.status).to.equal("projectStatus");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
