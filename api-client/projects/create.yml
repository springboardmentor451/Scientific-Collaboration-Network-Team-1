info:
  name: create
  type: http
  seq: 1

http:
  method: POST
  url: "{{projectUrl}}/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "name": "",
        "description": null,
        "start_date": null,
        "end_date": null,
        "researcher_ids": []
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: after-response
      code: |
        if (res.status === 201) {
          bru.setEnvVar("projectId", res.body.project_id);
        }
    - type: tests
      code: |
        test("status is 201", function() {
          expect(res.status).to.equal(201);
        });
        test("projectId saved", function() {
          expect(res.body.project_id).to.be.a("number");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
